name: PR Validation

on:
  pull_request:
    paths:
      - 'config.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run validation script
        run: node src/validate_config.js

      - name: Check for pr_comment.md
        id: comment-check
        run: |
          if [ -f pr_comment.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes in config.json
        id: git-check
        run: |
          if [ -n "$(git status --porcelain config.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes if reordered
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add config.json
          git commit -m "Auto-sort spiders in config.json"
          git push

      - name: Post PR comment
        if: steps.comment-check.outputs.exists == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: pr_comment.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
